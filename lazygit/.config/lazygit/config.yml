# fui // LAZYGIT
# Colours are ANSI names, so they follow the edition's console (cyan is the signal's slot).
gui:
  nerdFontsVersion: "3"
  border: single
  showRandomTip: false
  theme:
    activeBorderColor: [cyan, bold]
    inactiveBorderColor: [white]
    searchingActiveBorderColor: [yellow, bold]
    optionsTextColor: [blue]
    selectedLineBgColor: [reverse]
    inactiveViewSelectedLineBgColor: [bold]
    cherryPickedCommitFgColor: [cyan]
    cherryPickedCommitBgColor: [default]
    markedBaseCommitFgColor: [yellow]
    markedBaseCommitBgColor: [default]
    unstagedChangesColor: [red]
    defaultFgColor: [default]
