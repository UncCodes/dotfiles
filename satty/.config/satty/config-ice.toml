# GENERATED by theme/build.py from theme/tokens.toml. Edit the tokens, not this file.
# fui // SATTY, edition ice: annotating screenshots (SUPER+Print). fui mode links config.toml here.
[general]
fullscreen = false
early-exit = true
initial-tool = "arrow"
copy-command = "wl-copy"
annotation-size-factor = 1.5
output-filename = "~/Pictures/Screenshots/%Y%m%d-%H%M%S.png"
save-after-copy = false
default-hide-toolbars = false

[font]
family = "JetBrainsMono Nerd Font"
style = "Bold"

# the signal first, then the counter colour and the status colours
[color-palette]
palette = ["#1460D2", "#C2410C", "#B3261E", "#1B6E44", "#6A3FB5", "#F6F4FC"]
