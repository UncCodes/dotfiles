# fui // checks: every push installs the dotfiles in a fresh Arch Linux container and
# verifies the result (tests/run.sh), then screenshots the real apps in every theme
# (tests/preview.sh; the shots are attached to the run as "preview").
# A red X on GitHub means: don't pull this yet.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 45
    steps:
      - name: Prepare Arch
        run: |
          pacman -Syu --noconfirm --needed git sudo base-devel shellcheck luacheck python
          useradd -m tester
          echo 'tester ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/tester

      - uses: actions/checkout@v5

      - name: Install and test as a normal user
        run: |
          cp -a "$GITHUB_WORKSPACE" /home/tester/.dotfiles
          chown -R tester: /home/tester/.dotfiles
          sudo -u tester -H env DOTFILES_DIR=/home/tester/.dotfiles \
            bash /home/tester/.dotfiles/tests/run.sh

      - name: Screenshots of the real apps
        if: always()
        continue-on-error: true
        run: |
          pacman -S --noconfirm --needed xorg-server-xvfb imagemagick gtk3-demos gtk4-demos
          sudo -u tester -H env DOTFILES_DIR=/home/tester/.dotfiles \
            bash /home/tester/.dotfiles/tests/preview.sh
          mkdir -p preview && cp -r /home/tester/preview/. preview/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview
          path: preview
          if-no-files-found: ignore
