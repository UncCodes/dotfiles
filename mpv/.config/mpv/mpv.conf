# fui // MPV: the frame and on-screen text in the edition's console colours
# (fui mode links fui-colors.conf to colors-<edition>.conf)
include="~~/fui-colors.conf"
hwdec=auto-safe
keep-open=yes
osd-font="JetBrainsMono Nerd Font"
osd-font-size=28
osd-bar-h=2
screenshot-directory=~/Pictures/Screenshots
screenshot-template="mpv-%F-%P"
