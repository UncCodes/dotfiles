# fui // MPV: the frame and on-screen text in the edition's console colours
# (fui mode links fui-colors.conf to colors-<edition>.conf)
include="~~/fui-colors.conf"
hwdec=auto-safe
keep-open=yes
osd-font="JetBrainsMono Nerd Font"
osd-font-size=28
osd-bar-h=2
screenshot-directory=~/Pictures/Screenshots
screenshot-template="mpv-%F-%P"

# every picture and video as a colour halftone (shaders/fui-halftone.glsl; `d` toggles it)
glsl-shaders="~~/shaders/fui-halftone.glsl"

# mpv is the image viewer too, so pictures get the same screen: it opens the other files of the
# same kind beside the one you open (arrow keys / < > move through them) and holds each image
autocreate-playlist=same
[fui-image]
profile-cond=get("current-tracks/video/image", false) and not get("current-tracks/video/albumart", false)
profile-restore=copy
image-display-duration=inf
loop-file=no
