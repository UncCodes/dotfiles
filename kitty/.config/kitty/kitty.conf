# fui // KITTY: the terminal is a dark CRT screen in every theme
# (the portfolio's home terminal). The tab bar along the top is the window's gel title
# bar in the theme's colour, its tabs titled like windows: [0x01] zsh.

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11
disable_ligatures cursor

window_padding_width 12
background_opacity   0.94
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0.1

cursor_shape block
cursor_blink_interval 0.6
cursor_trail 2

tab_bar_edge          top
tab_bar_min_tabs      1
tab_bar_style         separator
tab_separator         " "
tab_bar_margin_height 0 6
tab_title_template    " [0x{index:02x}] {title} "
active_tab_font_style bold

# the screen: the fixed CRT palette (generated)
include crt.conf
# the tab bar: the theme's gel colour (fui mode links fui-colors.conf to colors-<theme>.conf)
include fui-colors.conf
