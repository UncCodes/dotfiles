# HUD // KITTY

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
disable_ligatures cursor

window_padding_width 14
background_opacity   0.70
confirm_os_window_close 0
enable_audio_bell no

cursor_shape block
cursor_blink_interval 0.6
cursor_trail 3

tab_bar_edge       top
tab_bar_style      separator
tab_separator      "  "
tab_title_template " {index:02d} {title} "

# ── colours ─────────────────────────────────────────────────────────────
foreground            #E6EBEC
background            #030506
selection_foreground  #030506
selection_background  #8FD3DC
cursor                #C99A4E
cursor_text_color     #030506
url_color             #8FD3DC
url_style             single

active_border_color   #8FD3DC
inactive_border_color #1A2428

active_tab_foreground   #030506
active_tab_background   #8FD3DC
active_tab_font_style   bold
inactive_tab_foreground #7D8A8F
inactive_tab_background #080C0E
tab_bar_background      #030506

mark1_background #C99A4E
mark1_foreground #030506

color0  #080C0E
color8  #2A3338
color1  #B5555A
color9  #CC7378
color2  #6FAF8A
color10 #92C7A6
color3  #C99A4E
color11 #DDB677
color4  #6F8FB0
color12 #93AECB
color5  #9A86B8
color13 #B5A6CC
color6  #8FD3DC
color14 #C8EEF2
color7  #B8C2C5
color15 #F4F6F6

# ── light / dark ────────────────────────────────────────────────────────
# fui mode (SUPER+SHIFT+T) links fui-mode.conf to colors.conf or colors-light.conf
# and reloads kitty. The colours above stay as the dark fallback.
include fui-mode.conf
