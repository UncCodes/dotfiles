# fui // KITTY: the console. Its 16 colours are mapped from the edition's roles, so every
# terminal program follows the edition (light editions keep a dark console). The tab bar
# along the top is the window's header plate: tabs numbered like index codes, the current
# one a solid plate in the signal.

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11
disable_ligatures cursor

window_padding_width 12
background_opacity   0.96
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0.1

cursor_shape block
# the caret blinks at 1 Hz: on 500 ms, off 500 ms
cursor_blink_interval 0.5
cursor_trail 2

tab_bar_edge          top
tab_bar_min_tabs      1
tab_bar_style         separator
tab_separator         " "
tab_bar_margin_height 0 6
tab_title_template    " {index:02d}  {title} "
active_tab_font_style bold

# the screen: the edition's console (fui mode links fui-console.conf to console-<edition>.conf)
include fui-console.conf
# the tab bar (fui-colors.conf -> colors-<edition>.conf)
include fui-colors.conf
# the display tier: black on a tube (fui display links fui-tier.conf to tier-<tier>.conf)
include fui-tier.conf
