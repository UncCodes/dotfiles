# fui // KITTY: the terminal is a night console in every theme. The tab bar along the top
# is the window's header plate: tabs numbered like asset codes, the current one in the
# theme's accent.

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11
disable_ligatures cursor

window_padding_width 12
background_opacity   0.96
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0.1

cursor_shape block
cursor_blink_interval 0.6
cursor_trail 2

tab_bar_edge          top
tab_bar_min_tabs      1
tab_bar_style         separator
tab_separator         " "
tab_bar_margin_height 0 6
tab_title_template    " {index:02d}  {title} "
active_tab_font_style bold

# the screen: the fixed console palette (generated)
include console.conf
# the tab bar: the theme's gel colour (fui mode links fui-colors.conf to colors-<theme>.conf)
include fui-colors.conf
