nav_accent = "#C00C2A"
link       = "#0A4F75"
ok         = "#00692B"
bad        = "#B3261E"
meta       = "#5C4347"
gel_hi     = "#BD4298"       # plum
gel_mid    = "#8C3170"
gel        = "#792A61"
gel_lo     = "#88306D"
gel_edge   = "#531D43"
gel_code   = "#FBD0EE"
edge       = "#6E3C3C73"
hi         = "#FFFFFF99"
lo         = "#5A282833"
glass      = "#FDE7D9BD"     # card 74%
glass_well = "#FCE0CE4D"
sheen      = "#FFFFFF73"
gloss      = "#FFFFFF6B"
gloss_lo   = "#FFFFFF0F"
arc        = "#5C434747"
bead       = "#46282C7A"
skin_aqua  = "#2F7FC4"
skin_teal  = "#1F8A80"
skin_steel = "#5B7896"
