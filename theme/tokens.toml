rule_hi    = "#3F3566"
edge       = "#6E63A3"
ink        = "#EDE9F8"
muted      = "#A79ECB"
faint      = "#6E63A3"
signal     = "#A47CFF"
signal_hi  = "#C4A6FF"
signal_dim = "#2C2052"
on_signal  = "#0B0716"
counter    = "#FF7AC6"
ok         = "#3DDC97"
warn       = "#F2A93B"
bad        = "#FF5C6C"
info       = "#6FC0FF"
shell      = "#3A2F68"
