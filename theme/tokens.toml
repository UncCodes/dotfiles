# ┌─ fui // DESIGN TOKENS ── the single source of truth ──────────────────┐
# │ The owned device of the millennium, cut square: chrome shells lit     │
# │ from above, gel keys, glowing LCD wells, one soft shadow, set in an   │
# │ instrument's type (labels and codes, numbers shown large and          │
# │ honestly). Drawn for the display it runs on.                          │
# │                                                                       │
# │ Components use ROLES (floor, panel, ink, signal ...), never raw hex.  │
# │ An EDITION is a complete palette named for its signal colour.         │
# │ A TIER is the display class: crt, lcd or deep (OLED / HDR / P3).      │
# │                                                                       │
# │ After editing:  python3 theme/build.py   (it checks every contrast)   │
# └───────────────────────────────────────────────────────────────────────┘

[meta]
name     = "fui"
# The editions, in the order `fui mode toggle` cycles them. The first is the default.
editions = ["aurora", "cyan", "amber", "phosphor", "acid", "hazard", "mono", "paper", "lab", "ice", "chrome", "slate", "ruby"]
# Names from earlier versions, so a saved choice survives an update.
renamed  = { night = "cyan", concrete = "paper" }
tiers    = ["crt", "lcd", "deep"]

# ── the workstation names itself by its machine: the distribution's logo, the host, the
#    operating system and the operator (read on the machine). The notice appears at the
#    thresholds: sign-in, the lock screen, boot, the start page.
[workstation]
notice   = "Authorized personnel only. Activity on this workstation is logged."

# ── editions ────────────────────────────────────────────────────────────
# Roles (every edition defines all of them):
#   void       the outermost field: the wallpaper's ground on deep, letterbox
#   floor      the base of the interface        panel   flat panels, windows, cards
#   raised     a hovered row, a pressed control  well    set-in fields, terminals, lists
#   rule       decorative hairlines (~1.3:1)     rule_hi grouping lines that must read (~2:1)
#   edge       boundaries of controls (at least 3:1 against panel)
#   ink        text and values                   muted   labels, metadata (at least 4.5:1)
#   faint      decorative or large text only     signal  focus, current, primary action, live data
#   signal_hi  hover or press                    signal_dim  the tint behind a selected row
#   on_signal  text on a signal fill             counter the second data series, never focus
#   ok warn bad info   status, always with a word
# [edition.X.crt] and [edition.X.deep] replace roles on those display tiers.
#   backdrop   the wallpaper it opens with: survey ribbon helix orbit fibre mesh (fui wallpaper pick
#              chooses one for every edition)
# Material roles (the device editions define them; the others derive them in palette.py):
#   shell      the device's chassis: window frames, the bar   shell_hi  its lit top
#   lcd        the backing of a lit display well               readout_ink   what it lights

