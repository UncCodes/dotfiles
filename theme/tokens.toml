[mode.light]                 # clean desk
bg         = "#FDFCFC"       # hsl(24 6% 99%)
card       = "#FFFFFF"
well       = "#FDFDFD"
text       = "#251D18"
muted      = "#6B575B"
accent     = "#0940D7"       # blue
nav_accent = "#0940D7"
link       = "#0B5C8A"
ok         = "#00692B"
bad        = "#B3261E"
meta       = "#6B575B"
gel_hi     = "#865EC9"       # grape
gel_mid    = "#6339AC"
gel        = "#583399"
gel_lo     = "#6138A8"
gel_edge   = "#422673"
gel_code   = "#E0D0FB"
edge       = "#6E555A6B"
hi         = "#FFFFFFE6"
lo         = "#462D3229"
glass      = "#FFFFFFBD"
glass_well = "#FDFDFD4D"
sheen      = "#FFFFFF73"
gloss      = "#FFFFFF6B"
gloss_lo   = "#FFFFFF0F"
arc        = "#3C2E3266"
