# ── the look: one visual language for every edition ────────────────────
# The owned device of the millennium, cut square: chrome shells lit from above (a bright lip,
# a dark horizon, a lighter reflection), gel keys with a specular highlight on the primary
# action, lit LCD wells, bevels, one soft shadow, expo-out glides with a hint of spring.
# The parts are boxy like the instrument's (4 px panels, 2 px keys); the device's outer shells
# stay round (the bar a capsule). The type is the instrument's.
[look]
radius     = 4          # windows, panels, popups
control    = 2          # buttons, fields, rows, keys
shell      = 14         # the device's outer shells: the bar (a capsule), launcher, console, OSD, lock and login, player
frame      = 2          # the chrome chassis around every window, px (crt: +1)
bevel      = 1
shadow     = true
shadow_y   = 8            # the focused window floats: a deep, soft shadow (the inactive ones a light one)
shadow_blur = 28
shadow_dark = 0.48
shadow_light = 0.30
glide      = [0.16, 1.0, 0.3, 1.0]
pop        = [0.3, 1.25, 0.6, 1.0]
popin      = "86%"
gloss_band = 0.48

# ── display tiers ───────────────────────────────────────────────────────
# `fui display auto` picks one from the connected screen (an analog input is a crt; a
# 10-bit or HDR output is deep; anything else is lcd). `fui display crt|lcd|deep` pins it.
[tier.crt]                    # phosphor glass: 2 px structure, a 3% safe inset, no emulated effects
hair      = 2                 # rules and panel edges
edge      = 2                 # control boundaries
stripe    = 4                 # the header plate's signal stripe
border    = 2                 # window edges
inset     = 0.03              # share of the screen kept clear at every edge
glass     = true              # glass on every tier: the identity's material (rules still separate)
finish    = false             # never emulate a tube on a tube
glow      = false
protect   = true              # static-content protection: idle dim, drift, early blanking

[tier.lcd]                    # a backlit panel: 1 px hairlines on the pixel grid
hair      = 1
edge      = 1
stripe    = 3
border    = 1
inset     = 0.0
glass     = true
finish    = true              # allowed as an opt-in (fui screen)
glow      = false
protect   = false

[tier.deep]                   # OLED / HDR / wide gamut: true black outside panels
hair      = 1
edge      = 1
stripe    = 3
border    = 1
inset     = 0.0
glass     = true
finish    = true
glow      = true              # one soft halo on the focused window, signal only
protect   = true

# ── geometry: square, or a small radius where the toolkit expects one ───
[geometry]
radius    = 4         # panels and windows (cap 6; square is always correct)
control   = 2         # buttons, fields, rows
header    = 34        # header plates
bar       = 32        # the status rail
gaps_in   = 8         # on the 4 px scale
gaps_out  = 16
focus     = 2         # focus rings and brackets
bracket   = 0.12      # bracket arm: share of the shorter side, 8-24 px
meter     = 5         # segments in the bar's meters

[space]
scale = [4, 8, 12, 16, 24, 32, 48, 64]

# glass: panels at this opacity, the compositor blurring what is behind them. Every tier has
# it; text on glass is checked against the panel over the darkest backdrop.
[glass]
panel = 0.72
well  = 0.60
window = 0.82   # an application window's own background (GTK): the text stays solid, the blur shows through

[opacity]
window_active   = 0.92
window_inactive = 0.86

[blur]
size       = 6
passes     = 2            # each pass is a full-screen sweep per blurred surface, every frame something under it moves
noise      = 0.015
contrast   = 1.0
brightness = 1.0
vibrancy   = 0.15

# The optional screen finish (fui screen; lcd and deep only): a faint vignette.
[screen]
scanline   = 0.0      # at most 0.15
vignette   = 0.10
on         = false

# ── type: four voices, at most three on one screen ──────────────────────
[font]
brand    = "Michroma"                 # the host name, the clock, display numerals
ui       = "Inter"                    # controls and prose
mono     = "JetBrainsMono Nerd Font"  # data, codes, labels, terminals
size     = 10
terminal_size = 11
label_tracking = 0.12                 # labels: tracked capitals
fallback = ["Noto Sans Arabic", "Noto Color Emoji"]

# ── motion: decisive, quick out and a firm settle ───────────────────────
[motion]
ease       = [0.25, 0.9, 0.25, 1.0]
instant    = 60
quick      = 140
standard   = 220
deliberate = 400

# ── safety ──────────────────────────────────────────────────────────────
[safety]
caret_hz       = 1      # a blinking caret, never faster
idle_dim_s     = 120    # crt / deep: dim after this long without input
dim_to         = 0.6    # ...to this share of the brightness
blank_s        = 300    # crt / deep: blank the screen after this long
drift_px       = 2      # static chrome moves within this many pixels
battery_alert  = 5      # %: the alert takeover while discharging
heat_alert     = 95     # °C

# ── desktop ─────────────────────────────────────────────────────────────
[desktop]
cursor_theme = "macOS"         # apple_cursor (AUR): the macOS-style set; Hyprland, GTK, Qt, XWayland, Plasma, the login screen
cursor_size  = 24
sound_theme  = "fui"             # theme/make-sounds.py

[desktop.dark]
gtk_base   = "adw-gtk3-dark"
icon_theme = "Papirus-Dark"
scheme     = "prefer-dark"

[desktop.light]
gtk_base   = "adw-gtk3"
icon_theme = "Papirus-Light"
scheme     = "prefer-light"

# ── icons: one family (Material Design outline, from the Nerd Font), codepoints in hex ──
# Every icon on the desktop comes from here; tests check the installed font has each one.
[icons]
# launcher and palette
apps         = "f003b"   # md-apps
windows      = "f05b2"   # md-window_restore
