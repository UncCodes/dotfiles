# ── fixed materials: the same in every theme, like real hardware ────────
[fixed]
white        = "#FFFFFF"     # the nav buttons
light_gray   = "#545454"     # nav hover sweep
lighter_gray = "#C1C1C1"     # the blink's second colour
lcd_bg       = "#B9C4A6"     # grey-green handheld LCD
lcd_ink      = "#17220F"
lcd_ghost    = "#17220F1A"   # unlit segments
graphite_hi  = "#565C65"     # the slab: a graphite plate, dark in every theme
graphite     = "#353A41"
graphite_mid = "#22262B"
graphite_lo  = "#2E3238"
plate_ink    = "#EEF2F6"
metal_hi     = "#FFFFFF"     # the slab's steel cap
metal        = "#D6DCE4"
gel_text     = "#FFFFFF"     # titles on the aero gel
crt_bg       = "#0D0D0D"     # the terminal: a dark CRT screen in every theme
crt_fg       = "#D4D4D4"
crt_bright   = "#F2F2F2"
crt_dim      = "#8A8A8A"

# The CRT's 16 colours (the portfolio's home terminal). Every terminal program inherits them.
[terminal]
normal = ["#1A1A1A", "#FF6B6B", "#5FD75F", "#E5C07B", "#6AB0FF", "#C678DD", "#56D4DD", "#D4D4D4"]
bright = ["#5A5A5A", "#FF8F8F", "#87E787", "#F0D19B", "#94C6FF", "#D79BE7", "#84E2E9", "#F2F2F2"]

# ── geometry ────────────────────────────────────────────────────────────
[geometry]
radius      = 10      # window frame
well_radius = 6       # inset well
bar_radius  = 6       # menubar strip, inner bar corners
pill_radius = 999     # gel pills
bar_height  = 32      # title bars (28-32)
border      = 2       # Hyprland window edge (the focused one carries the gel colour)
gaps_in     = 6
gaps_out    = 12

# ── surfaces ────────────────────────────────────────────────────────────
[opacity]
window_active   = 0.97   # frosted plastic: the lattice glows faintly through
window_inactive = 0.92

[blur]
size       = 8
passes     = 3
noise      = 0.02
contrast   = 1.0
brightness = 1.0
vibrancy   = 0.2

# Old-screen glass over the whole screen (a Hyprland screen shader; `fui screen off` removes it)
[screen]
scanline   = 0.157   # one dark line every 3 device pixels (the site's scan-3.png: 40/255)
phosphor   = 0.055   # RGB stripes on the pixel columns
vignette   = 0.16    # darker corners
on         = true

# ── type ────────────────────────────────────────────────────────────────
[font]
wordmark = "Michroma"                 # the @user wordmark: an extended Eurostile-style face
mono     = "JetBrainsMono Nerd Font"  # structure: labels, readouts, paths, terminals
pixel    = "ProFontIIx Nerd Font"     # window titles, only at 18px or 27px
lcd      = "DSEG7 Classic"            # only on LCD glass (bold italic)
sans     = "Noto Sans"                # reading: app text
size     = 10
terminal_size = 11
fallback = ["Noto Sans Arabic", "Noto Color Emoji"]

# ── motion ──────────────────────────────────────────────────────────────
[motion]
ease  = [0.2, 0.8, 0.2, 1.0]   # the site's cubic-bezier for folds and fills
glide = 320                    # ms: the theme change
blink = 2.0                    # s: the active nav button's blink

# ── desktop ─────────────────────────────────────────────────────────────
[desktop]
cursor_theme = "Adwaita"
cursor_size  = 24
sound_theme  = "fui"            # theme/make-sounds.py: the site's synthesised interface sounds

[desktop.dark]
gtk_base   = "adw-gtk3-dark"
icon_theme = "Papirus-Dark"
scheme     = "prefer-dark"

[desktop.mid]
gtk_base   = "adw-gtk3"
icon_theme = "Papirus-Light"
scheme     = "prefer-light"

[desktop.light]
gtk_base   = "adw-gtk3"
icon_theme = "Papirus-Light"
scheme     = "prefer-light"
