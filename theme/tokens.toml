# ┌─ fui // DESIGN TOKENS ── the single source of truth ──────────────────┐
# │ Y2K cybercore, after aljulandani.dev (its VISUAL-IDENTITY.md):        │
# │ one person's computer from the 2000s web. Every surface is a window   │
# │ of frosted, glossy plastic with a 1px bevel, a gel title bar and an   │
# │ inset well, over a quiet network-lattice backdrop and old-screen      │
# │ glass. Hand-made and early-web; never a sci-fi HUD.                   │
# │                                                                       │
# │ After editing:  python3 theme/build.py                                │
# │ Colours with an alpha channel are written #RRGGBBAA.                  │
# └───────────────────────────────────────────────────────────────────────┘

[meta]
name  = "fui"
# The three themes, in the order `fui mode toggle` cycles them. The first is the default.
modes = ["dark", "mid", "light"]

# ── themes: only the colour changes; plastic, shapes and type stay ──────
# Values are the portfolio's presets (public/js/theme-init.js, style.css).
[mode.dark]                  # night terminal
bg         = "#0C0A09"       # hsl(24 14% 4%): the desk
card       = "#171412"       # bg + 4% lightness: plastic faces
well       = "#080706"       # the inset well: bg 70% + black
text       = "#F5F2F0"
muted      = "#A8959A"
accent     = "#0FF05A"       # phosphor green
nav_accent = "#1F7A34"       # the accent on white buttons (the bright green fails AA on white)
link       = "#6CC4FF"
ok         = "#3DDC84"
bad        = "#FF8A80"
meta       = "#F5F2F0"       # bar readouts: full ink on the dark bar
gel_hi     = "#2AB2A9"       # the aero gel bar (teal): four stops, top to bottom
gel_mid    = "#1D7C76"
gel        = "#186762"
gel_lo     = "#1C7872"
gel_edge   = "#0F3E3B"
gel_code   = "#D0FBF8"       # [0xNN] codes on the gel
edge       = "#4AF48366"     # window, well and pill outlines (accent 30% into white 14%)
hi         = "#FFFFFF24"     # bevel highlight, top-left
lo         = "#0000008C"     # bevel shade, bottom-right
glass      = "#171412CC"     # frosted window face (card 80%)
glass_well = "#08070657"     # the well over the glass (well 34%)
sheen      = "#FFFFFF1A"     # the diagonal sheen across a face
gloss      = "#FFFFFF1F"     # the top half of a gel or pill
gloss_lo   = "#FFFFFF05"     # the bottom half
arc        = "#DCCDD233"     # lattice lines
bead       = "#F0E6E96B"     # lattice beads
skin_aqua  = "#62B6FF"
skin_teal  = "#4FD1C0"
skin_steel = "#9FB9D3"
kind_cyan  = "#45D3EC"
kind_violet= "#B49CFF"
kind_green = "#4FE0A0"
kind_amber = "#FFBD59"
kind_rose  = "#FF7D97"

