# fui // HYPRLOCK: the lock screen is a whoami window
# Frosted plastic over the blurred desktop: a gel title bar, an inset well with the @user
# wordmark, an LCD clock and a pill password field. Colours and fonts: fui-colors.conf,
# a link to colors-<theme>.conf (written by theme/build.py).
source = ~/.config/hypr/fui-colors.conf

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.02
    brightness = 0.8
}

# ── the window: frame, gel bar, well ────────────────────────────────────
shape {
    monitor =
    size = 480, 360
    color = $glass
    rounding = 10
    border_size = 1
    border_color = $edge
    position = 0, 20
    halign = center
    valign = center
}
shape {
    monitor =
    size = 470, 32
    color = $gel_mid
    rounding = 16
    border_size = 1
    border_color = $gel_edge
    position = 0, 179
    halign = center
    valign = center
}
label {
    monitor =
    text = <span foreground="##$gel_code_hex">[0x00]</span> whoami
    color = $gel_text
    font_size = 14
    font_family = $font_pixel
    position = -150, 179
    halign = center
    valign = center
}
shape {
    monitor =
    size = 470, 314
    color = $glass_well
    rounding = 6
    border_size = 1
    border_color = $edge
    position = 0, -2
    halign = center
    valign = center
}

# ── the wordmark and the host ───────────────────────────────────────────
label {
    monitor =
    text = @$USER
    color = $accent
    font_size = 24
    font_family = $font_wordmark
    position = 0, 112
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:0] cat /etc/hostname
    color = $muted
    font_size = 11
    font_family = $font_mono
    position = 0, 76
    halign = center
    valign = center
}

# ── the LCD clock ───────────────────────────────────────────────────────
shape {
    monitor =
    size = 250, 70
    color = $lcd_bg
    rounding = 3
    border_size = 1
    border_color = $edge
    position = 0, 12
    halign = center
    valign = center
}
label {
    monitor =
    text = 88:88
    color = $lcd_ghost
    font_size = 38
    font_family = DSEG7 Classic Bold Italic
    position = 0, 12
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $lcd_ink
    font_size = 38
    font_family = DSEG7 Classic Bold Italic
    position = 0, 12
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A %d %b %Y"
    color = $muted
    font_size = 11
    font_family = $font_mono
    position = 0, -40
    halign = center
    valign = center
}

# ── the password field: an inset pill ───────────────────────────────────
input-field {
    monitor =
    size = 320, 40
    outline_thickness = 1
    rounding = -1
    outer_color = $edge
    inner_color = $well
    font_color = $text
    check_color = $nav_accent
    fail_color = $bad
    fail_text = wrong password ($ATTEMPTS)
    placeholder_text = password
    dots_size = 0.22
    dots_spacing = 0.5
    dots_center = true
    fade_on_empty = false
    font_family = $font_mono
    position = 0, -98
    halign = center
    valign = center
}
