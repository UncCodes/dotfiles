# fui // HYPRLOCK: employee authentication
# A flat glass panel over the blurred desktop: a header plate with the accent stripe, the
# company mark and name, a large clock, the operator and node, a passphrase field, and the
# logging notice along the bottom of the screen. Colours, fonts and the brand: fui-colors.conf,
# a link to colors-<theme>.conf (written by theme/build.py).
source = ~/.config/hypr/fui-colors.conf

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.01
    brightness = 0.7
}

# ── the panel ───────────────────────────────────────────────────────────
shape {
    monitor =
    size = 520, 400
    color = $glass
    rounding = 6
    border_size = 1
    border_color = $line_hi
    position = 0, 10
    halign = center
    valign = center
}
# the header plate and its accent stripe
shape {
    monitor =
    size = 518, 38
    color = $panel
    rounding = 0
    position = 0, 190
    halign = center
    valign = center
}
shape {
    monitor =
    size = 3, 38
    color = $accent
    rounding = 0
    position = -258, 190
    halign = center
    valign = center
}
label {
    monitor =
    text = AUTHENTICATION
    color = $text
    font_size = 9
    font_family = Inter SemiBold
    position = -180, 190
    halign = center
    valign = center
}
label {
    monitor =
    text = AUTH-00
    color = $faint
    font_size = 9
    font_family = $font_mono
    position = 210, 190
    halign = center
    valign = center
}

# ── the company ─────────────────────────────────────────────────────────
image {
    monitor =
    path = ~/.local/share/fui/brand/mark.png
    size = 44
    rounding = 0
    border_size = 0
    position = 0, 128
    halign = center
    valign = center
}
label {
    monitor =
    text = $brand_name
    color = $text
    font_size = 15
    font_family = $font_brand
    position = 0, 82
    halign = center
    valign = center
}
label {
    monitor =
    text = $brand_division
    color = $muted
    font_size = 8
    font_family = Inter SemiBold
    position = 0, 58
    halign = center
    valign = center
}

# ── the clock ───────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 40
    font_family = $font_brand
    position = 0, 4
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A %d %B %Y" | tr a-z A-Z
    color = $muted
    font_size = 8
    font_family = Inter SemiBold
    position = 0, -40
    halign = center
    valign = center
}

# ── the operator and the passphrase ─────────────────────────────────────
label {
    monitor =
    text = cmd[update:0] echo "OPERATOR  $USER    NODE  $(cat /etc/hostname)"
    color = $muted
    font_size = 9
    font_family = $font_mono
    position = 0, -78
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 340, 42
    outline_thickness = 1
    rounding = 4
    outer_color = $line_hi
    inner_color = $well
    font_color = $text
    check_color = $accent
    fail_color = $bad
    fail_text = ACCESS DENIED ($ATTEMPTS)
    placeholder_text = ENTER PASSPHRASE
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    font_family = $font_mono
    position = 0, -128
    halign = center
    valign = center
}

# ── the notice ──────────────────────────────────────────────────────────
label {
    monitor =
    text = $brand_notice
    color = $faint
    font_size = 9
    font_family = $font_mono
    position = 0, 40
    halign = center
    valign = bottom
}
