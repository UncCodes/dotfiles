# HUD // LOCK

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper.png
    blur_passes = 2
    blur_size = 4
    noise = 0.03
    brightness = 0.55
}

# top-left: system tag
label {
    monitor =
    text = A C C E S S  //  L O C K E D
    color = rgb(7D8A8F)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 70, -68
    halign = left
    valign = top
}

# the clock is this screen's one amber thing
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(C99A4E)
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b %Y" | tr a-z A-Z
    color = rgb(E6EBEC)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = USER  $USER
    color = rgb(8FD3DC)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 46
    outline_thickness = 1
    rounding = 0
    outer_color = rgb(8FD3DC)
    inner_color = rgba(0A101499)
    font_color = rgb(E6EBEC)
    check_color = rgb(C99A4E)
    fail_color = rgb(B5555A)
    fail_text = DENIED  ($ATTEMPTS)
    placeholder_text = <span foreground="##7D8A8F">ENTER KEY</span>
    dots_size = 0.22
    dots_spacing = 0.5
    dots_center = true
    fade_on_empty = false
    position = 0, -110
    halign = center
    valign = center
}

# ── FUI micro-geometry: frame brackets, reticle, peripheral telemetry ────
label {
    monitor =
    text = ┌──
    color = rgba(8FD3DC99)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 28, -28
    halign = left
    valign = top
}
label {
    monitor =
    text = ──┐
    color = rgba(8FD3DC99)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = -28, -28
    halign = right
    valign = top
}
label {
    monitor =
    text = └──
    color = rgba(8FD3DC99)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 28, 28
    halign = left
    valign = bottom
}
label {
    monitor =
    text = ──┘
    color = rgba(8FD3DC99)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = -28, 28
    halign = right
    valign = bottom
}
label {
    monitor =
    text = ⌖
    color = rgba(8FD3DC66)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 290
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:30000] echo "UPTIME  $(uptime -p | sed 's/^up //' | tr a-z A-Z)"
    color = rgba(7D8A8FCC)
    font_size = 9
    font_family = JetBrainsMono Nerd Font
    position = 60, 40
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:30000] echo "HOST  $(cat /etc/hostname | tr a-z A-Z)   ∷∷∷"
    color = rgba(7D8A8FCC)
    font_size = 9
    font_family = JetBrainsMono Nerd Font
    position = -60, 40
    halign = right
    valign = bottom
}
