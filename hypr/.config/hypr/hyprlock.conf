# fui // HYPRLOCK: authentication
# A threshold, where the workstation names itself: a glass panel over the blurred desktop, a
# header plate (the signal stripe, AUTHENTICATION, its code), the distribution's logo, the
# host and the OS, a large clock in the brand voice, the operator and kernel, a passphrase
# field, and the notice along the bottom. On crt and deep screens the clock moves a little every minute (fui lockclock).
#   fui-colors.conf  the edition's colours, fonts and brand    fui mode
#   fui-tier.conf    the display tier's colours and strokes     fui display
#   lock-look.conf      the layout: a frosted panel under a chrome strip, the clock the hero
source = ~/.config/hypr/fui-colors.conf
source = ~/.config/hypr/fui-tier.conf

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.01
    brightness = 0.6
}

# the layout
source = ~/.config/hypr/lock-look.conf
