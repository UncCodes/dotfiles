# fui // HYPRIDLE: idle steps
# On crt and deep screens (tubes and OLED wear where static pixels sit) `fui idle` dims the
# screen after 2 minutes, nudges the bar by a pixel (burn-in drift) and blanks the screen
# after 5; on lcd those two steps do nothing. Every screen locks after 10 minutes and
# switches off after 15.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# crt / deep: dim static content and drift the bar
listener {
    timeout = 120
    on-timeout = ~/.local/bin/fui idle dim
    on-resume = ~/.local/bin/fui idle wake
}

# crt / deep: blank the screen (not a bright screensaver)
listener {
    timeout = 300
    on-timeout = ~/.local/bin/fui idle blank
    on-resume = ~/.local/bin/fui idle wake
}

# lock after 10 minutes
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# screens off after 15 minutes
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
