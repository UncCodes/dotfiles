# fui // HYPRLOCK · the look: the welcome screen
# A boxy shell over the blurred desktop, its title strip lit from above; the machine's mark in
# a square tile, the owner's name, the passphrase pressed into the shell, the time in a lit LCD
# well in the brand face, the notice small along the bottom. Sourced by hyprlock.conf.

# ── the shell ───────────────────────────────────────────────────────────
shape {
    monitor =
    size = 480, 420
    color = $glass
    rounding = 4
    border_size = 1
    border_color = $shell_hi $shell 90deg
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(00000066)
    position = 0, 10
    halign = center
    valign = center
}
# the title strip, shell metal
shape {
    monitor =
    size = 476, 34
    color = $shell
    rounding = 4
    position = 0, 201
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:0] echo "Welcome to $(~/.local/bin/fui brand --host)"
    color = $ink
    font_size = 10
    font_family = $font_ui
    position = 0, 201
    halign = center
    valign = center
}

# ── the machine's mark in a square tile ─────────────────────────────────
shape {
    monitor =
    size = 86, 86
    color = $raised
    rounding = 2
    border_size = 2
    border_color = $signal_hi $signal 90deg
    position = 0, 122
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:0] ~/.local/bin/fui brand --logo
    color = $signal
    font_size = 34
    font_family = $font_mono
    position = 0, 122
    halign = center
    valign = center
}

# ── the owner ───────────────────────────────────────────────────────────
label {
    monitor =
    text = $USER
    color = $ink
    font_size = 17
    font_family = $font_ui
    position = 0, 58
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:0] ~/.local/bin/fui brand --os
    color = $muted
    font_size = 9
    font_family = $font_ui
    position = 0, 34
    halign = center
    valign = center
}

# ── the passphrase: a field pressed into the shell ──────────────────────
input-field {
    monitor =
    size = 300, 38
    outline_thickness = 1
    rounding = 2
    outer_color = $edge
    inner_color = $well
    font_color = $ink
    check_color = $signal
    fail_color = $bad
    fail_text = Passphrase not accepted · attempt $ATTEMPTS
    placeholder_text = Type your passphrase
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    fade_on_empty = false
    font_family = $font_ui
    position = 0, -16
    halign = center
    valign = center
}

# ── the time: a lit LCD well ────────────────────────────────────────────
shape {
    monitor =
    size = 220, 62
    color = $readout
    rounding = 2
    border_size = 1
    border_color = $shade
    position = 0, -100
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] ~/.local/bin/fui lockclock
    color = $readout_ink
    font_size = 28
    font_family = $font_brand
    position = 0, -96
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] echo "$(LC_TIME=C date +"%a %d %b" | tr a-z A-Z)"
    color = $muted
    font_size = 9
    font_family = $font_mono
    position = 0, -150
    halign = center
    valign = center
}

# ── the notice ──────────────────────────────────────────────────────────
label {
    monitor =
    text = $notice
    color = $muted
    font_size = 9
    font_family = $font_ui
    position = 0, 40
    halign = center
    valign = bottom
}
