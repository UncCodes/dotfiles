# fui // HYPRLOCK · the layout: authentication
# The instrument's lock screen in the device's materials: a frosted glass panel (round, the
# desktop blurred behind it) under a chrome title strip (AUTHENTICATION and its code), the
# distribution's logo in the signal, the host in the brand voice and the OS, the clock as the
# hero value, the operator and kernel as readouts, the passphrase field pressed into the glass,
# and the notice along the bottom. Sourced by hyprlock.conf.

# ── the panel: frosted glass, a lit rim ─────────────────────────────────
shape {
    monitor =
    size = 520, 420
    color = $glass
    rounding = 16
    border_size = $hair
    border_color = $chrome_top $rim 90deg
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(00000066)
    position = 0, 10
    halign = center
    valign = center
}

# ── the title strip: chrome, round along the top, square where it meets the glass ──
shape {
    monitor =
    size = 518, 38
    color = $chrome_mid
    rounding = 15
    position = 0, 200
    halign = center
    valign = center
}
shape {
    monitor =
    size = 518, 20
    color = $chrome_mid
    rounding = 0
    position = 0, 191
    halign = center
    valign = center
}
shape {                     # the hairline where the strip meets the glass
    monitor =
    size = 518, 1
    color = $rim
    rounding = 0
    position = 0, 181
    halign = center
    valign = center
}
shape {                     # the gloss: a lit edge along the strip's top
    monitor =
    size = 480, 1
    color = rgba(FFFFFF55)
    rounding = 0
    position = 0, 218
    halign = center
    valign = center
}
label {
    monitor =
    text = 󰳌  AUTHENTICATION
    color = $ink
    font_size = 9
    font_family = $font_mono
    position = -170, 200
    halign = center
    valign = center
}
label {
    monitor =
    text = AUTH-00
    color = $chrome_ink_off
    font_size = 9
    font_family = $font_mono
    position = 214, 200
    halign = center
    valign = center
}

# ── the machine: the distribution's logo, the host, the OS ──────────────
label {
    monitor =
    text = cmd[update:0] ~/.local/bin/fui brand --logo
    color = $signal
    font_size = 30
    font_family = $font_mono
    position = 0, 132
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:0] ~/.local/bin/fui brand --host
    color = $ink
    font_size = 15
    font_family = $font_brand
    position = 0, 86
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:0] ~/.local/bin/fui brand --os
    color = $muted
    font_size = 8
    font_family = $font_mono
    position = 0, 62
    halign = center
    valign = center
}

# ── the clock: the hero value ───────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] ~/.local/bin/fui lockclock
    color = $ink
    font_size = 40
    font_family = $font_brand
    position = 0, 6
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] echo "$(LC_TIME=C date +"%a %d %b · %Y-%m-%d" | tr a-z A-Z)"
    color = $muted
    font_size = 9
    font_family = $font_mono
    position = 0, -38
    halign = center
    valign = center
}

# ── the operator and the passphrase ─────────────────────────────────────
label {
    monitor =
    text = cmd[update:0] echo "[ OPERATOR  $USER ]   [ KERNEL  $(uname -r | cut -d- -f1) ]"
    color = $muted
    font_size = 9
    font_family = $font_mono
    position = 0, -76
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 340, 40
    outline_thickness = 1
    rounding = 2
    outer_color = $rim
    inner_color = $well
    font_color = $ink
    check_color = $signal $signal_hi 90deg
    fail_color = $bad
    fail_text = 󰅚  FAULT · PASSPHRASE REJECTED · ATTEMPT $ATTEMPTS
    placeholder_text = ENTER PASSPHRASE
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    font_family = $font_mono
    position = 0, -128
    halign = center
    valign = center
}

# ── the notice ──────────────────────────────────────────────────────────
label {
    monitor =
    text = $notice
    color = $muted
    font_size = 9
    font_family = $font_mono
    position = 0, 40
    halign = center
    valign = bottom
}
