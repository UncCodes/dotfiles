# GENERATED by theme/build.py: the light twin of hypr/.config/hypr/hyprlock.conf. Edit that file (or [light.color] in tokens.toml), not this one.
# HUD // LOCK

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper-light.png
    blur_passes = 2
    blur_size = 4
    noise = 0.03
    brightness = 0.92
}

# top-left: system tag
label {
    monitor =
    text = A C C E S S  //  L O C K E D
    color = rgb(5B686D)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 70, -68
    halign = left
    valign = top
}

# the clock is this screen's one amber thing
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(9A6516)
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b %Y" | tr a-z A-Z
    color = rgb(141B1E)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = USER  $USER
    color = rgb(1F7A87)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 46
    outline_thickness = 1
    rounding = 0
    outer_color = rgb(1F7A87)
    inner_color = rgba(F7F9F999)
    font_color = rgb(141B1E)
    check_color = rgb(9A6516)
    fail_color = rgb(A63C43)
    fail_text = DENIED  ($ATTEMPTS)
    placeholder_text = <span foreground="##5B686D">ENTER KEY</span>
    dots_size = 0.22
    dots_spacing = 0.5
    dots_center = true
    fade_on_empty = false
    position = 0, -110
    halign = center
    valign = center
}

# ── FUI micro-geometry: frame brackets, reticle, peripheral telemetry ────
label {
    monitor =
    text = ┌──
    color = rgba(1F7A8799)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 28, -28
    halign = left
    valign = top
}
label {
    monitor =
    text = ──┐
    color = rgba(1F7A8799)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = -28, -28
    halign = right
    valign = top
}
label {
    monitor =
    text = └──
    color = rgba(1F7A8799)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 28, 28
    halign = left
    valign = bottom
}
label {
    monitor =
    text = ──┘
    color = rgba(1F7A8799)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = -28, 28
    halign = right
    valign = bottom
}
label {
    monitor =
    text = ⌖
    color = rgba(1F7A8766)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 290
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:30000] echo "UPTIME  $(uptime -p | sed 's/^up //' | tr a-z A-Z)"
    color = rgba(5B686DCC)
    font_size = 9
    font_family = JetBrainsMono Nerd Font
