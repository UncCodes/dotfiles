# fui // HYPRLOCK · look instrument: a glass panel with a header plate, the machine, a large
# clock in the brand voice, the operator and kernel, the passphrase field and the notice.
# hyprlock.conf sources this through fui-look-lock.conf (fui mode links it by the edition's look).

# ── the panel ───────────────────────────────────────────────────────────
shape {
    monitor =
    size = 520, 400
    color = $glass
    rounding = 4
    border_size = $hair
    border_color = $rule_hi
    position = 0, 10
    halign = center
    valign = center
}
# the header plate and its signal stripe
shape {
    monitor =
    size = 518, 36
    color = $panel
    rounding = 0
    position = 0, 191
    halign = center
    valign = center
}
shape {
    monitor =
    size = $stripe, 36
    color = $signal
    rounding = 0
    position = -258, 191
    halign = center
    valign = center
}
label {
    monitor =
    text = 󰳌  AUTHENTICATION
    color = $ink
    font_size = 9
    font_family = $font_mono
    position = -176, 191
    halign = center
    valign = center
}
label {
    monitor =
    text = AUTH-00
    color = $faint
    font_size = 9
    font_family = $font_mono
    position = 214, 191
    halign = center
    valign = center
}

# ── the machine: the distribution's logo, the host, the OS ──────────────
label {
    monitor =
    text = cmd[update:0] ~/.local/bin/fui brand --logo
    color = $signal
    font_size = 30
    font_family = $font_mono
    position = 0, 128
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:0] ~/.local/bin/fui brand --host
    color = $ink
    font_size = 15
    font_family = $font_brand
    position = 0, 82
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:0] ~/.local/bin/fui brand --os
    color = $muted
    font_size = 8
    font_family = $font_mono
    position = 0, 58
    halign = center
    valign = center
}

# ── the clock: the hero value ───────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] ~/.local/bin/fui lockclock
    color = $ink
    font_size = 40
    font_family = $font_brand
    position = 0, 4
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] echo "$(LC_TIME=C date +"%a %d %b · %Y-%m-%d" | tr a-z A-Z)"
    color = $muted
    font_size = 9
    font_family = $font_mono
    position = 0, -40
    halign = center
    valign = center
}

# ── the operator and the passphrase ─────────────────────────────────────
label {
    monitor =
    text = cmd[update:0] echo "[ OPERATOR  $USER ]   [ KERNEL  $(uname -r | cut -d- -f1) ]"
    color = $muted
    font_size = 9
    font_family = $font_mono
    position = 0, -78
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 340, 40
    outline_thickness = $hair
    rounding = 2
    outer_color = $edge
    inner_color = $well
    font_color = $ink
    check_color = $signal
    fail_color = $bad
    fail_text = 󰅚  FAULT · PASSPHRASE REJECTED · ATTEMPT $ATTEMPTS
    placeholder_text = ENTER PASSPHRASE
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = false
    font_family = $font_mono
    position = 0, -128
    halign = center
    valign = center
}

# ── the notice ──────────────────────────────────────────────────────────
label {
    monitor =
    text = $notice
    color = $muted
    font_size = 9
    font_family = $font_mono
    position = 0, 40
    halign = center
    valign = bottom
}
