# fui // STARSHIP: the console prompt
#   󰀓 mo@workstation  󰉖 ~/projects/app  󰘬 main *
#   >
# Colours are ANSI names, so the prompt follows the edition's console: the operator in the
# signal (slot 6), the path in info (12), git in warn (3), quiet details in bright black.
# Each part leads with its icon (tokens.toml [icons]).

add_newline = true

format = """
[󰀓 $username@$hostname](bold cyan)  $directory$git_branch$git_status$python$nodejs$rust$golang$cmd_duration
$character"""

[username]
show_always = true
format = "$user"

[hostname]
ssh_only = false
format = "$hostname"

[character]
success_symbol = "[>](bold cyan)"
error_symbol   = "[>](bold red)"
vimcmd_symbol  = "[<](bold yellow)"

[directory]
style = "bold bright-blue"
truncation_length = 4
truncate_to_repo = false
format = "[󰉖 $path]($style)[$read_only]($read_only_style)  "
read_only = " 󰍁"

[git_branch]
symbol = "󰘬 "
style = "yellow"
format = "[$symbol$branch]($style)"

[git_status]
style = "yellow"
format = "[( $all_status$ahead_behind)]($style)  "
modified = "*"
staged = "+"
untracked = "?"
deleted = "-"
ahead = "↑${count}"
behind = "↓${count}"

[cmd_duration]
min_time = 2000
style = "bright-black"
format = "[󰔛 $duration]($style)  "

[python]
symbol = "󰌠 "
style = "bright-black"
format = "[$symbol$version]($style)  "

[nodejs]
symbol = "󰎙 "
style = "bright-black"
format = "[$symbol$version]($style)  "

[rust]
symbol = "󱘗 "
style = "bright-black"
format = "[$symbol$version]($style)  "

[golang]
symbol = "󰟓 "
style = "bright-black"
format = "[$symbol$version]($style)  "
