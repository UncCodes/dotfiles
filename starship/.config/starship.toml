# fui // STARSHIP: the console prompt
#   mo@workstation  ~/projects/app  main *
#   >
# Colours are the fixed console palette: cyan operator, blue path, amber git.

add_newline = true

format = """
[$username@$hostname](bold #00C2D1)  $directory$git_branch$git_status$python$nodejs$rust$golang$cmd_duration
$character"""

[username]
show_always = true
format = "$user"

[hostname]
ssh_only = false
format = "$hostname"

[character]
success_symbol = "[>](bold #00C2D1)"
error_symbol   = "[>](bold #FF5C6C)"
vimcmd_symbol  = "[<](bold #F2A93B)"

[directory]
style = "bold #8FB0FF"
truncation_length = 4
truncate_to_repo = false
format = "[$path]($style)[$read_only]($read_only_style)  "
read_only = " ro"

[git_branch]
symbol = ""
style = "#F2A93B"
format = "[$branch]($style)"

[git_status]
style = "#F2A93B"
format = "[( $all_status$ahead_behind)]($style)  "
modified = "*"
staged = "+"
untracked = "?"
deleted = "-"
ahead = "↑${count}"
behind = "↓${count}"

[cmd_duration]
min_time = 2000
style = "#7D8894"
format = "[$duration]($style)  "

[python]
symbol = "py "
style = "#7D8894"
format = "[$symbol$version]($style)  "

[nodejs]
symbol = "node "
style = "#7D8894"
format = "[$symbol$version]($style)  "

[rust]
symbol = "rs "
style = "#7D8894"
format = "[$symbol$version]($style)  "

[golang]
symbol = "go "
style = "#7D8894"
format = "[$symbol$version]($style)  "
