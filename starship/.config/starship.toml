# fui // STARSHIP: the portfolio terminal's prompt
#   user@host:~/projects/app (main *)$
# Colours are the fixed CRT palette: green user, blue path, amber git.

add_newline = true

format = """
[$username@$hostname](bold #5FD75F)[:](#D4D4D4)$directory$git_branch$git_status$python$nodejs$rust$golang$cmd_duration
$character"""

[username]
show_always = true
format = "$user"

[hostname]
ssh_only = false
format = "$hostname"

[character]
success_symbol = "[\\$](#D4D4D4)"
error_symbol   = "[\\$](bold #FF6B6B)"
vimcmd_symbol  = "[:](bold #E5C07B)"

[directory]
style = "bold #6AB0FF"
truncation_length = 4
truncate_to_repo = false
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " ro"

[git_branch]
symbol = ""
style = "#E5C07B"
format = "[\\($branch]($style)"

[git_status]
style = "#E5C07B"
format = "[( $all_status$ahead_behind)\\)]($style) "
modified = "*"
staged = "+"
untracked = "?"
deleted = "-"
ahead = "↑${count}"
behind = "↓${count}"

[cmd_duration]
min_time = 2000
style = "#8A8A8A"
format = "[took $duration]($style) "

[python]
symbol = "py "
style = "#8A8A8A"
format = "[$symbol$version]($style) "

[nodejs]
symbol = "node "
style = "#8A8A8A"
format = "[$symbol$version]($style) "

[rust]
symbol = "rs "
style = "#8A8A8A"
format = "[$symbol$version]($style) "

[golang]
symbol = "go "
style = "#8A8A8A"
format = "[$symbol$version]($style) "
