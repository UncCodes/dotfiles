# GENERATED by theme/build.py: the light twin of starship/.config/starship.toml. Edit that file (or [light.color] in tokens.toml), not this one.
# HUD // STARSHIP
# ┌ ▣ ~/projects/app  main ✱  py 3.13
# └ ›

add_newline = true

format = """
[┌](#C9D2D5) [▣](#1F7A87) $directory$git_branch$git_status$python$nodejs$rust$golang$cmd_duration
[└](#C9D2D5) $character"""

[character]
success_symbol = "[›](bold #1F7A87)"
error_symbol   = "[›](bold #A63C43)"
vimcmd_symbol  = "[‹](bold #9A6516)"

[directory]
style = "bold #141B1E"
truncation_length = 4
truncate_to_repo = false
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " RO"

[git_branch]
symbol = " "
style = "#1F7A87"
format = "[$symbol$branch]($style) "

[git_status]
style = "#9A6516"
format = "[$all_status$ahead_behind]($style) "
modified = "✱"
staged = "+"
untracked = "?"
deleted = "-"
ahead = "↑${count}"
behind = "↓${count}"

[cmd_duration]
min_time = 2000
style = "#5B686D"
format = "[T+$duration]($style) "

[python]
symbol = "py "
style = "#5B686D"
format = "[$symbol$version]($style) "

[nodejs]
symbol = "node "
style = "#5B686D"
format = "[$symbol$version]($style) "

[rust]
symbol = "rs "
style = "#5B686D"
format = "[$symbol$version]($style) "

[golang]
symbol = "go "
style = "#5B686D"
format = "[$symbol$version]($style) "
